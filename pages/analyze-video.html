    <meta charset="UTF-8">

    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.svg">
    
    <title>Analyze Video - Sherboa</title>
    <meta
        name="description"
        content="Analyze video quality with Sherboa using advanced quality metrics. Get detailed results, charts and downloadable reports."
    >
</head>


<body>
    <header>
        <a href="../index.html">
            <img class="logo-header" src="../assets/images/sh-isotipo-inverted.svg" alt="sherboa engine isotype" loading="lazy">
        </a>
        <h1>sherboa engine</h1>
    </header>



    <nav>
        <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-menu">
        <img src="../assets/images/menu-ham.svg" alt="">
        </button>

        <ul id="nav-menu">
            <li><a href="../index.html">home</a></li>
            <li><a href="./how-it-works.html">how-it-works</a></li>

            <li><a href="./about.html">about</a></li>
            <li><a href="./contact.html">contact</a></li>
        </ul>
    </nav>

    <main>
        <h2>check out your videos here</h2>
        
        <article class="analyze-form">
            <p class="paragraph">
                compare a reference video against a distorted version.<br>
                please note: processing time may extend according to videos' lenght.
            </p>

            <form id="vmaf-form" novalidate>
                <div class="file-input">
                    <label for="reference-video">reference video</label>
                    <input type="file" id="reference-video" name="reference" accept="video/*" required>
                </div>

                <div class="file-input">
                    <label for="distorted-video">distorted video</label>
                    <input type="file" id="distorted-video" name="distorted" accept="video/*" required>
                </div>

                <button type="submit">analyze</button>
            </form>

            <div id="vmaf-result"></div>
            <div id="vmaf-chart-container" class="chart-container">
                <canvas id="vmaf-chart"></canvas>
            </div>

            <div id="psnr-result"></div>
            <div id="psnr-chart-container" class="chart-container">
                <canvas id="psnr-chart"></canvas>
            </div>

            <div id="ssim-result"></div>

            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script src="../js/analyze-video.js"></script>
        </article>
    </main>

    <footer>

        </a>

        </p>

    <script src="../js/navbar.js"></script>
</body>

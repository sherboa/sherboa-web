    <main>
        <h2>get in touch</h2>
        
        <article>
            <p class="paragraph">
                feel free to reach out with your feedback, questions or suggestions.
            </p>

            <form action="https://formspree.io/f/xgavlqyj" method="POST" autocomplete="on">
                <fieldset>
                    <div class="contact-form">
                        <label for="nombre">name: *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="your name" required>
                    </div>

                    <div class="contact-form">
                        <label for="correo">e-mail: *</label>
                        <input type="email" id="correo" name="correo" placeholder="user@domain.com" title="invalid e-mail format" required>
                    </div>

                    <div class="contact-form">
                        <label for="mensaje">message: </label><br>
                        <textarea id="mensaje" name="mensaje" rows="8" required></textarea>
                    </div>

                    <div class="contact-form">
                        <button type="submit">send</button>
                        <button type="reset">clean form</button>
                    </div>
                </fieldset>
            </form>
        </article>
    </main>
